# Builds the Docker image and publishes it to GitHub Container Registry (GHCR)
# as ghcr.io/<owner>/<repo>:edge on every push to main.
#
# No secrets to configure: it authenticates with the built-in GITHUB_TOKEN.
# After the first run, set the package to "public" under the repository's
# Packages settings if you want to pull it without logging in.
name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: read
  packages: write # needed to push to GHCR

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true # a newer push replaces a build still in progress

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx let one job build for both PC/NAS (amd64) and Raspberry Pi (arm64).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name (forced to lowercase, as registries require)
      # and attaches standard labels such as a link back to this repo.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=edge

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max